[project]
name = "iot-serial-diagnostics-tool"
version = "0.2.0"
description = "Generic serial and USB diagnostics tool using synthetic port data."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]
serial = [
    "pyserial>=3.5,<4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
