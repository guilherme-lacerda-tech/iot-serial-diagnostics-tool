[project]
name = "iot-serial-diagnostics-tool"
version = "0.3.0"
description = "Generic serial and USB diagnostics tool using synthetic port data."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=7.0,<8.0",
    "ruff>=0.16,<1.0",
]
serial = [
    "pyserial>=3.5,<4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["iot_serial_diagnostics_tool"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E402", "E501"]
